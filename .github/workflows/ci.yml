name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: npm
          cache-dependency-path: plugins/kstack/package-lock.json

      - name: Install plugin runtime dependencies
        run: npm ci
        working-directory: plugins/kstack

      - name: Prepare lockfile-pinned Rust oracle dependencies
        shell: bash
        run: |
          while IFS= read -r manifest; do
            cargo fetch --locked --manifest-path "$manifest"
          done < <(find plugins/kstack/native -name Cargo.toml -type f | sort)

      - name: Run tests
        run: npm test

      - name: Run Reflexion memory gate
        run: npm run test:memory-gate

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="/tmp/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check -
          sudo tar -xzf "$archive" -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan full Git history
        run: gitleaks git --redact --verbose --log-opts="$GITHUB_SHA" .
