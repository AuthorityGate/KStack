[graph]
targets = ["x86_64-unknown-linux-gnu"]
all-features = false
no-default-features = false

[advisories]
yanked = "deny"
unmaintained = "none"
unsound = "none"
ignore = []

[licenses]
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
  "bzip2-1.0.6",
]
confidence-threshold = 0.8
exceptions = []

[licenses.private]
ignore = false
registries = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
  "https://github.com/agentclientprotocol/rust-sdk",
]

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
